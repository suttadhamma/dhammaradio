<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สถานีวิทยุธรรมะ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }
    body {
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .player-card {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      text-align: center;
    }
    .station-title {
      font-size: 18px;
      font-weight: bold;
      color: #512da8;
      margin-bottom: 6px;
    }
    .station-sub {
      font-size: 13px;
      color: #666666;
      margin-bottom: 15px;
    }
    audio {
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="station-title">วัดป่าจริยธรรม อ.นาด้วง จ.เลย</div>
    <div class="station-sub">FM 96.50 MHz</div>
    
    <audio controls preload="none">
      <source src="http://watpa.no-ip.org:8007/;" type="audio/mpeg">
      เบราว์เซอร์ของคุณไม่รองรับการเล่นเสียง
    </audio>
  </div>

</body>
</html>
